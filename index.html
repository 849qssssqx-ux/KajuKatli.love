<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kashaf</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Montserrat',sans-serif;
  background:radial-gradient(circle at top,#ff8fb1,#ff5f87);
  color:white;
  overflow-x:hidden;
}
#gate{
  position:fixed;inset:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99999;
}
#holdBtn{
  width:200px;height:200px;
  border-radius:50%;
  border:none;
  font-size:18px;
  color:white;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  position:relative;
}
#progress{
  position:absolute;
  bottom:0;left:0;
  height:6px;
  background:white;
  width:0%;
}
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.glass{
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(25px);
  border-radius:30px;
  padding:60px 40px;
  max-width:800px;
}
h1{
  font-family:'Playfair Display',serif;
  font-size:56px;
}
#type{
  font-size:24px;
  font-style:italic;
  min-height:50px;
}
.whisper{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  font-size:14px;
  opacity:.8;
}
section{
  padding:120px 20px;
  text-align:center;
}
</style>
</head>

<body>

<audio id="music" src="music.mp3" loop></audio>

<div id="gate">
  <button id="holdBtn">
    Hold & Enter
    <div id="progress"></div>
  </button>
</div>

<div class="hero">
  <div class="glass">
    <h1>Kashaf</h1>
    <p>You are not part of my life.</p>
    <p><b>You are my life.</b></p>
    <div id="type"></div>
  </div>
</div>

<section id="section1">
  <h2>Every universe leads to you</h2>
</section>

<section id="section2">
  <h2>Forever means Kashaf</h2>
</section>

<div class="whisper" id="whisper"></div>

<script>
/* ================= VOICE ENGINE ================= */
let voices=[];
function loadVoices(){
  voices=speechSynthesis.getVoices();
}
speechSynthesis.onvoiceschanged=loadVoices;
loadVoices();

function speak(text){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.voice=voices.find(v=>v.lang.startsWith("en")&&v.name.toLowerCase().includes("female"))||voices[0];
    u.rate=0.85;
    u.pitch=1.1;
    u.volume=1;
    speechSynthesis.speak(u);
    showWhisper(text);
  }catch(e){
    showWhisper(text);
  }
}

/* BACKUP TEXT WHISPER */
function showWhisper(text){
  const w=document.getElementById("whisper");
  w.textContent=text;
  w.style.opacity=1;
  setTimeout(()=>w.style.opacity=0,4000);
}

/* ================= HOLD TO ENTER ================= */
let hold=0,interval;
const btn=document.getElementById("holdBtn");
const prog=document.getElementById("progress");

function startHold(){
  if(navigator.vibrate) navigator.vibrate(50);
  interval=setInterval(()=>{
    hold+=2;
    prog.style.width=hold+"%";
    if(hold>=100){
      clearInterval(interval);
      enterSite();
    }
  },30);
}
function stopHold(){
  clearInterval(interval);
  hold=0;
  prog.style.width="0%";
}

btn.addEventListener("mousedown",startHold);
btn.addEventListener("touchstart",startHold);
document.addEventListener("mouseup",stopHold);
document.addEventListener("touchend",stopHold);

/* ================= ENTER ================= */
function enterSite(){
  document.getElementById("gate").style.display="none";
  const m=document.getElementById("music");
  if(m) m.play().catch(()=>{});
  speak("Kashaf… I was waiting for you.");
}

/* FAILSAFE */
setTimeout(()=>{
  const g=document.getElementById("gate");
  if(g) g.style.display="none";
},3500);

/* ================= TYPEWRITER ================= */
const lines=[
  "Kashaf, you are the soul of my soul.",
  "Every heartbeat chooses you.",
  "I would find you in every universe."
];
let l=0,c=0;
const t=document.getElementById("type");
(function type(){
  if(c<lines[l].length){
    t.textContent+=lines[l][c++];
    setTimeout(type,60);
  }else{
    setTimeout(()=>{
      t.textContent="";
      c=0;
      l=(l+1)%lines.length;
      type();
    },2500);
  }
})();

/* ================= VOICE ON SCROLL ================= */
let spoken=false;
window.addEventListener("scroll",()=>{
  if(window.scrollY>300 && !spoken){
    spoken=true;
    speak("No matter how far you go, I am with you, Kashaf.");
  }
});

/* MIDNIGHT MESSAGE */
if(new Date().getHours()===0){
  setTimeout(()=>speak("It is midnight, Kashaf. I was thinking of you."),3000);
}
</script>

</body>
</html>
