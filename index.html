<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Kashaf ❤️</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  color: white;
  text-align: center;
}
.section {
  padding: 60px 20px;
}
h1 {
  font-size: 42px;
}
.heart {
  font-size: 40px;
  animation: beat 1.5s infinite;
}
@keyframes beat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}
</style>
</head>
<body>

<div class="section">
  <h1>To My Kashaf 💕</h1>
  <p>You are my favorite person, my happiness, my forever.</p>
  <div class="heart">❤️</div>
</div>

<div class="section">
  <h2>I Choose You</h2>
  <p>
    In every lifetime, in every universe,  
    my heart will always find you.
  </p>
</div>

<footer class="section">
  Made with ❤️ just for Kashaf
</footer>

</body>
</html>
